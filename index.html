<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>capp-adocia</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    @font-face {
        font-family: '0xProtoPropo';
        src: url('fonts/0xProtoNerdFontPropo-Regular.ttf') format('truetype');
        font-weight: 400;
        font-display: swap;
    }

    @font-face {
        font-family: '0xProtoPropo';
        src: url('fonts/0xProtoNerdFontPropo-Bold.ttf') format('truetype');
        font-weight: 600;
        font-display: swap;
    }

    body {
      font-family: '0xProtoPropo', -apple-system, BlinkMacSystemFont, "Noto Sans SC", sans-serif;
      background: #ffffff;
      color: #1f2328;
      line-height: 1.6;
      min-height: 100vh;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    /* 左侧 1/3 */
    .sidebar {
      flex: 1;
      border-right: 1px solid #e1e4e8;
      padding: 48px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .username {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .userinfo {
      font-size: 0.9rem;
      color: #656d76;
      margin-bottom: 28px;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      background: #f0f0f0;
      border: 1px solid #e1e4e8;
      margin-bottom: 28px;
    }

    .links {
      width: 100%;
      max-width: 200px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .links a {
      display: block;
      padding: 10px 16px;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      text-decoration: none;
      color: #1f2328;
      font-size: 0.9rem;
      text-align: center;
      transition: background 0.15s, border-color 0.15s;
    }

    .links a:hover {
      background: #f6f8fa;
      border-color: #0969da;
      color: #0969da;
    }

    /* 右侧 2/3 */
    .main {
      flex: 2;
      padding: 48px 56px;
      overflow-y: auto;
    }

    .main h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: #1f2328;
    }

    .main section {
      margin-bottom: 36px;
    }

    .main p {
      font-size: 0.95rem;
      color: #1f2328;
      margin-bottom: 12px;
    }

    .main ul {
      list-style: none;
      padding: 0;
    }

    .main ul li {
      font-size: 0.95rem;
      color: #1f2328;
      padding: 4px 0;
    }

    .main ul li::before {
      content: "·";
      color: #656d76;
      margin-right: 8px;
    }

    /* 窄屏：上下堆叠 */
    @media (max-width: 768px) {
      .layout {
        flex-direction: column;
      }
      .sidebar {
        border-right: none;
        border-bottom: 1px solid #e1e4e8;
        padding: 32px 24px;
      }
      .main {
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>
  <div class="layout">

    <!-- 左侧 1/3：个人信息 -->
    <aside class="sidebar">
      <div class="username">capp-adocia</div>
      <div class="userinfo">C++ / 图形学 / 系统编程</div>

      <img class="avatar" src="avatar.jpg" alt="头像" onerror="this.style.visibility='hidden'">

      <div class="links">
        <a href="https://github.com/capp-adocia" target="_blank" rel="noopener">GitHub</a>
        <a href="mailto:you@example.com">Email</a>
      </div>
    </aside>

    <!-- 右侧 2/3：个人介绍 -->
    <main class="main">

      <section>
        <h2>关于我</h2>
        <p>这里写一段自我介绍。可以说说你在做什么、对什么感兴趣、正在学什么。比如：正在写一个自己的图形引擎，平时喜欢折腾 Linux 和底层的东西。</p>
      </section>

      <section>
        <h2>技能</h2>
        <ul>
          <li>C++</li>
          <li>OpenGL</li>
          <li>Linux</li>
          <li>CMake</li>
          <li>Git</li>
        </ul>
      </section>

      <section>
        <h2>项目</h2>
        <p>VortexEngine — 一个自己写的图形引擎。</p>
      </section>

      <section>
        <h2>联系</h2>
        <p>想交流或者合作，可以通过左侧的 GitHub 或 Email 找我。</p>
      </section>

    </main>

  </div>
</body>
</html>
