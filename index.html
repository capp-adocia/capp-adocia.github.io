<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>capp-adocia</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 右上角工具栏 -->
  <div class="toolbar">
    <button id="theme-toggle" title="切换主题">🌙</button>
  </div>

  <div class="layout">

    <!-- 左侧 1/4：个人信息 -->
    <aside class="sidebar">
      <div class="username" data-field="username"></div>
      <div class="userinfo" data-field="userinfo"></div>

      <img class="avatar" src="image/githublogo.jpg" alt="头像" onerror="this.style.visibility='hidden'">

      <div class="profile-meta">
        <div class="meta-item"><span data-field="realnameLabel"></span><strong data-field="realnameValue"></strong></div>
        <div class="meta-item"><span data-field="birthLabel"></span><strong data-field="birthValue"></strong></div>
        <div class="meta-item"><span data-field="nationalityLabel"></span><strong data-field="nationalityValue"></strong></div>
        <div class="meta-item"><span data-field="currentCityLabel"></span><strong data-field="currentCityValue"></strong></div>
        <div class="meta-item"><span data-field="roleLabel"></span><strong data-field="roleValue"></strong></div>
      </div>

      <div class="interest-tags" id="interest-tags"></div>

      <div class="links">
        <a id="github-link" target="_blank" rel="noopener" data-field="githubLabel"></a>
        <a id="email-link" data-field="emailLabel"></a>
      </div>
    </aside>

    <!-- 右侧 3/4：个人介绍 -->
    <main class="main">

      <section>
        <h2 data-field="aboutTitle"></h2>
        <p data-field="aboutBody"></p>
        <p class="lead" data-field="aboutDetail"></p>
      </section>

      <section>
        <h2 data-field="skillsTitle"></h2>
        <div class="tags" id="skills-tags"></div>
      </section>

      <section>
        <h2 data-field="projectsTitle"></h2>
        <p data-field="projectsBody"></p>
      </section>

      <section>
        <h2 data-field="hobbiesTitle"></h2>
        <div class="grid" id="hobbies-grid"></div>
      </section>

      <section>
        <h2 data-field="toolsTitle"></h2>
        <div class="tags" id="tools-tags"></div>
      </section>

      <section>
        <h2 data-field="platformsTitle"></h2>
        <p data-field="platformsBody"></p>
      </section>

      <section>
        <h2 data-field="contactTitle"></h2>
        <p data-field="contactBody"></p>
      </section>

    </main>

  </div>

  <script>
    // ===== 主题切换 =====
    const themeToggle = document.getElementById('theme-toggle');
    const root = document.documentElement;

    function applyTheme(theme) {
      root.setAttribute('data-theme', theme);
      themeToggle.textContent = theme === 'dark' ? '🌙' : '☀️';
      localStorage.setItem('theme', theme);
    }

    // 初始化：优先 localStorage，否则默认dark
    applyTheme(localStorage.getItem('theme') || 'dark');

    themeToggle.addEventListener('click', () => {
      const current = root.getAttribute('data-theme');
      applyTheme(current === 'dark' ? 'light' : 'dark');
    });

    // ===== 页面数据：统一在这里维护 =====
    const pageData = {
      pageTitle: 'capp-adocia',
      username: 'capp-adocia',
      userinfo: 'C++ / 图形学 / 系统编程',
      realnameLabel: '真实姓名',
      realnameValue: '司岚',
      birthLabel: '出生年月',
      birthValue: '2003.08.26',
      nationalityLabel: '国籍',
      nationalityValue: '中国',
      currentCityLabel: '城市',
      currentCityValue: '湖州',
      roleLabel: '身份',
      roleValue: '学生',
      githubLabel: 'GitHub',
      githubUrl: 'https://github.com/capp-adocia',
      emailLabel: 'Email',
      emailUrl: 'mailto:2636427505@qq.com',
      tags: ['图形学', 'C++', 'Linux', '开源'],
      aboutTitle: '关于我',
      aboutBody: '我是capp-adocia，一名关注计算机图形学与系统编程的开发者。',
      aboutDetail: '喜欢从底层理解程序如何运行，也享受把复杂问题逐步拆解、实现和优化的过程。',
      skillsTitle: '技能', skills: ['C++', 'OpenGL', 'Linux', 'CMake', 'Git'], projectsTitle: '项目',
      projectsBody: 'VortexEngine 一个自己写的图形引擎。',
      hobbiesTitle: '兴趣爱好',
      hobbies: [
        { title: '编程与图形学', body: '研究渲染技术、引擎架构与性能优化。' },
        { title: '享受Linux', body: '喜欢配置开发环境、尝试不同发行版和桌面工具。' },
        { title: '开源与技术阅读', body: '关注开源项目，阅读源码和优秀技术文档。' },
        { title: '日常爱好', body: '喜欢下棋，比如金铲铲、酒馆战棋，偶尔玩一些单机游戏。' },
        { title: '常用操作系统', body: '操作系统偏爱 Linux 家族，目前笔记本在用 Windows 10 专业版，台式电脑在用 Ubuntu 26.04。Linux 目前最大的问题是驱动，其他方面还好。' }
      ],
      toolsTitle: '常用工具',
      tools: ['Neovim / Visual Studio', 'Clang / GCC', 'CMake', 'Git', 'RenderDoc'],
      platformsTitle: '常逛平台',
      platformsBody: 'GitHub、Stack Overflow、Bilibili 和各类开发者社区。',
      contactTitle: '联系',
      contactBody: '想交流或者合作，可以通过GitHub或Email找我。'
    };

    function renderText() {
      document.querySelectorAll('[data-field]').forEach(el => {
        const value = pageData[el.dataset.field];
        if (typeof value === 'string') el.textContent = value;
      });
      document.title = pageData.pageTitle;
    }

    function renderTags(id, items) {
      document.getElementById(id).innerHTML = items
        .map(item => `<span>${item}</span>`)
        .join('');
    }

    function renderContent() {
      renderText();
      renderTags('interest-tags', pageData.tags);
      renderTags('skills-tags', pageData.skills);
      renderTags('tools-tags', pageData.tools);

      document.getElementById('hobbies-grid').innerHTML = pageData.hobbies
        .map(hobby => `
          <div class="card">
            <h3>${hobby.title}</h3>
            <p>${hobby.body}</p>
          </div>
        `)
        .join('');

      document.getElementById('github-link').href = pageData.githubUrl;
      document.getElementById('email-link').href = pageData.emailUrl;
    }

    renderContent();
  </script>
</body>
</html>
