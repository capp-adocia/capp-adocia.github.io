<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>capp-adocia</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
/* ===== 主题变量 ===== */
    :root[data-theme="dark"] {
      --bg: #0d1117;
      --text: #e6edf3;
      --muted: #8b949e;
      --border: #30363d;
      --card: #161b22;
      --link: #58a6ff;
      --btn-bg: #21262d;
      --btn-hover: #30363d;
    }

    :root[data-theme="light"] {
      --bg: #ffffff;
      --text: #1f2328;
      --muted: #656d76;
      --border: #d0d7de;
      --card: #f6f8fa;
      --link: #0969da;
      --btn-bg: #f6f8fa;
      --btn-hover: #eaeef2;
    }

    /* ===== 字体 ===== */
    @font-face {
      font-family: '0xProtoPropo';
      src: url('fonts/0xProtoNerdFontPropo-Regular.ttf') format('truetype');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: '0xProtoPropo';
      src: url('fonts/0xProtoNerdFontPropo-Bold.ttf') format('truetype');
      font-weight: 600;
      font-display: swap;
    }

    body {
      font-family: '0xProtoPropo', -apple-system, BlinkMacSystemFont, "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
    }

    /* ===== 顶部工具栏（固定右上角） ===== */
    .toolbar {
      position: fixed;
      top: 16px;
      right: 20px;
      display: flex;
      gap: 8px;
      z-index: 100;
    }

    .toolbar button {
      font-family: inherit;
      font-size: 0.85rem;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--btn-bg);
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .toolbar button:hover {
      background: var(--btn-hover);
      border-color: var(--link);
      color: var(--link);
    }

    /* ===== 布局 ===== */
    .layout {
      display: flex;
      min-height: 100vh;
    }

    /* 左侧 1/4 */
    .sidebar {
      flex: 0 0 25%;
      border-right: 1px solid var(--border);
      padding: 48px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .username {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .userinfo {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--card);
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .profile-meta {
      width: 100%;
      max-width: 240px;
      margin-bottom: 20px;
      border-top: 1px solid var(--border);
    }

    .meta-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 2px;
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
    }

    .meta-item span {
      color: var(--muted);
    }

    .meta-item strong {
      font-weight: 400;
      text-align: right;
    }

    .interest-tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      max-width: 240px;
      margin-bottom: 22px;
    }

    .links {
      width: 100%;
      max-width: 220px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .links a {
      display: block;
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
      color: var(--text);
      font-size: 0.9rem;
      text-align: center;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .links a:hover {
      background: var(--card);
      border-color: var(--link);
      color: var(--link);
    }

    /* 右侧 3/4 */
    .main {
      flex: 1;
      padding: 48px 56px;
      overflow-y: auto;
      max-width: 1100px;
    }

    .main h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text);
    }

    .main section {
      margin-bottom: 36px;
    }

    .main p {
      font-size: 0.95rem;
      color: var(--text);
      margin-bottom: 12px;
    }

    .main .lead {
      color: var(--muted);
      font-size: 1rem;
    }

    .main ul {
      list-style: none;
      padding: 0;
    }

    .main ul li {
      font-size: 0.95rem;
      color: var(--text);
      padding: 4px 0;
    }

    .main ul li::before {
      content: "·";
      color: var(--muted);
      margin-right: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
    }

    .card h3 {
      margin-bottom: 6px;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tags span,
    .interest-tags span {
      padding: 3px 9px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--card);
      color: var(--muted);
      font-size: 0.8rem;
    }

    /* 窄屏：上下堆叠 */
    @media (max-width: 768px) {
      .layout {
        flex-direction: column;
      }
      .sidebar {
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 32px 24px;
        position: static;
        height: auto;
      }
      .main {
        padding: 32px 24px;
      }
      .grid {
        grid-template-columns: 1fr;
      }
      .toolbar {
        top: 12px;
        right: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- 右上角工具栏 -->
  <div class="toolbar">
    <button id="theme-toggle" title="切换主题">🌙</button>
  </div>

  <div class="layout">

    <!-- 左侧 1/4：个人信息 -->
    <aside class="sidebar">
      <div class="username" data-field="username"></div>
      <div class="userinfo" data-field="userinfo"></div>

      <img class="avatar" src="image/githublogo.jpg" alt="头像" onerror="this.style.visibility='hidden'">

      <div class="profile-meta">
        <div class="meta-item"><span data-field="realnameLabel"></span><strong data-field="realnameValue"></strong></div>
        <div class="meta-item"><span data-field="birthLabel"></span><strong data-field="birthValue"></strong></div>
        <div class="meta-item"><span data-field="nationalityLabel"></span><strong data-field="nationalityValue"></strong></div>
        <div class="meta-item"><span data-field="roleLabel"></span><strong data-field="roleValue"></strong></div>
      </div>

      <div class="interest-tags" id="interest-tags"></div>

      <div class="links">
        <a id="github-link" target="_blank" rel="noopener" data-field="githubLabel"></a>
        <a id="email-link" data-field="emailLabel"></a>
      </div>
    </aside>

    <!-- 右侧 3/4：个人介绍 -->
    <main class="main">

      <section>
        <h2 data-field="aboutTitle"></h2>
        <p data-field="aboutBody"></p>
        <p class="lead" data-field="aboutDetail"></p>
      </section>

      <section>
        <h2 data-field="skillsTitle"></h2>
        <div class="tags" id="skills-tags"></div>
      </section>

      <section>
        <h2 data-field="projectsTitle"></h2>
        <p data-field="projectsBody"></p>
      </section>

      <section>
        <h2 data-field="hobbiesTitle"></h2>
        <div class="grid" id="hobbies-grid"></div>
      </section>

      <section>
        <h2 data-field="toolsTitle"></h2>
        <div class="tags" id="tools-tags"></div>
      </section>

      <section>
        <h2 data-field="platformsTitle"></h2>
        <p data-field="platformsBody"></p>
      </section>

      <section>
        <h2 data-field="contactTitle"></h2>
        <p data-field="contactBody"></p>
      </section>

    </main>

  </div>

  <script>
    // ===== 主题切换 =====
    const themeToggle = document.getElementById('theme-toggle');
    const root = document.documentElement;

    function applyTheme(theme) {
      root.setAttribute('data-theme', theme);
      themeToggle.textContent = theme === 'dark' ? '🌙' : '☀️';
      localStorage.setItem('theme', theme);
    }

    // 初始化：优先 localStorage，否则默认 dark
    applyTheme(localStorage.getItem('theme') || 'dark');

    themeToggle.addEventListener('click', () => {
      const current = root.getAttribute('data-theme');
      applyTheme(current === 'dark' ? 'light' : 'dark');
    });

    // ===== 页面数据：统一在这里维护 =====
    const pageData = {
      pageTitle: 'capp-adocia',
      username: 'capp-adocia',
      userinfo: 'C++ / 图形学 / 系统编程',
      realnameLabel: '真实姓名',
      realnameValue: '司岚',
      birthLabel: '出生年月',
      birthValue: '2003.08.26',
      nationalityLabel: '国籍',
      nationalityValue: '中国',
      roleLabel: '身份',
      roleValue: '学生',
      githubLabel: 'GitHub',
      githubUrl: 'https://github.com/capp-adocia',
      emailLabel: 'Email',
      emailUrl: 'mailto:2636427505@qq.com',
      tags: ['图形学', 'C++', 'Linux', '开源'],
      aboutTitle: 'About me',
      aboutBody: '我是 capp-adocia，一名关注计算机图形学与系统编程的开发者。',
      aboutDetail: '喜欢从底层理解程序如何运行，也享受把复杂问题逐步拆解、实现和优化的过程。',
      skillsTitle: '技能',
      skills: ['C++', 'OpenGL', 'Linux', 'CMake', 'Git'],
      projectsTitle: '项目',
      projectsBody: 'VortexEngine — 一个自己写的图形引擎。',
      hobbiesTitle: '兴趣爱好',
      hobbies: [
        { title: '编程与图形学', body: '研究渲染技术、引擎架构与性能优化。' },
        { title: '折腾 Linux', body: '喜欢配置开发环境、尝试不同发行版和桌面工具。' },
        { title: '开源与技术阅读', body: '关注开源项目，阅读源码和优秀技术文档。' },
        { title: '日常爱好', body: '喜欢下棋，比如金铲铲、酒馆战棋，偶尔玩一些单机游戏。' },
        { title: '常用操作系统', body: '操作系统偏爱 Linux 家族，目前笔记本在用 Windows 10 专业版，台式电脑在用 Ubuntu 26.04。Linux 目前最大的问题是驱动，其他方面还好。' }
      ],
      toolsTitle: '常用工具',
      tools: ['Neovim / Visual Studio', 'Clang / GCC', 'CMake', 'Git', 'RenderDoc'],
      platformsTitle: '常逛平台',
      platformsBody: 'GitHub、Stack Overflow、Bilibili 和各类开发者社区。',
      contactTitle: '联系',
      contactBody: '想交流或者合作，可以通过 GitHub 或 Email 找我。'
    };

    function renderText() {
      document.querySelectorAll('[data-field]').forEach(el => {
        const value = pageData[el.dataset.field];
        if (typeof value === 'string') el.textContent = value;
      });
      document.title = pageData.pageTitle;
    }

    function renderTags(id, items) {
      document.getElementById(id).innerHTML = items
        .map(item => `<span>${item}</span>`)
        .join('');
    }

    function renderContent() {
      renderText();
      renderTags('interest-tags', pageData.tags);
      renderTags('skills-tags', pageData.skills);
      renderTags('tools-tags', pageData.tools);

      document.getElementById('hobbies-grid').innerHTML = pageData.hobbies
        .map(hobby => `
          <div class="card">
            <h3>${hobby.title}</h3>
            <p>${hobby.body}</p>
          </div>
        `)
        .join('');

      document.getElementById('github-link').href = pageData.githubUrl;
      document.getElementById('email-link').href = pageData.emailUrl;
    }

    renderContent();
  </script>
</body>
</html>
